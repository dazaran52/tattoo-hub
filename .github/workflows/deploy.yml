name: Deploy Backend to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy backend files via scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "backend/*"
          target: "/app"
          strip_components: 0

      - name: Restart backend service
        uses: appleboy/ssh-action@v0.1.10
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: POSTGRES_URL
          script: |
            set -euo pipefail

            if [ -z "${POSTGRES_URL:-}" ]; then
                echo "POSTGRES_URL GitHub secret is required for backend migrations" >&2
                exit 1
            fi

            cd /app/backend
            # Install any new dependencies if needed
            if [ ! -d ".venv" ]; then
                python3.12 -m venv .venv
            fi
            source .venv/bin/activate
            pip install -r requirements.txt
            # Apply schema changes atomically before starting code that depends on them.
            python run_migration.py \
              migrations/049_manual_certificate_verification.sql \
              migrations/050_marketplace_success_fee.sql \
              migrations/051_create_exchange_rates.sql \
              migrations/052_security_stabilization.sql \
              migrations/053_fix_exchange_rates_rls.sql
            # Restart the service
            systemctl restart tattoohub.service
